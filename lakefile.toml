name = "REPL"
defaultTargets = ["repl"]
testDriver = "test"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.34.0-rc2"

[[lean_lib]]
name = "REPL"

[[lean_exe]]
name = "repl"
root = "REPL.Main"
supportInterpreter = true

[[lean_exe]]
name = "test"
root = "Test"
